name: Bug report
description: Report a reproducible problem with chatgpt-local-workbench
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.14.0"
    validations:
      required: true

  - type: input
    id: bridge_version
    attributes:
      label: chatgpt-local-workbench version or commit
      placeholder: "e.g. 1.7.0-local.3 or a commit SHA"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, passwords, keys, and personal information before sharing.
      render: shell
      placeholder: Paste relevant logs here.
